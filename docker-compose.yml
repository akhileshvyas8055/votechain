version: '3.9'

services:
  # ─── PostgreSQL Database ──────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: votechain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: votechain_db
      POSTGRES_USER: votechain
      POSTGRES_PASSWORD: votechain_secret
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U votechain -d votechain_db']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - votechain-network

  # ─── Redis Cache ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: votechain-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-}"
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - votechain-network

  # ─── IPFS Node ────────────────────────────────
  ipfs:
    image: ipfs/kubo:v0.24.0
    container_name: votechain-ipfs
    restart: unless-stopped
    ports:
      - '4001:4001'   # Swarm
      - '5001:5001'   # API
      - '8080:8080'   # Gateway
    volumes:
      - ipfs_data:/data/ipfs
      - ipfs_staging:/export
    healthcheck:
      test: ['CMD-SHELL', 'ipfs dag stat /ipfs/QmUNLLsPACCz1vLxQVkXqqLX5R1X345qqfHbsf67hvA3Nn || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - votechain-network

  # ─── Backend API ──────────────────────────────
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: votechain-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://votechain:votechain_secret@postgres:5432/votechain_db?schema=public
      REDIS_URL: redis://redis:6379
      IPFS_URL: http://ipfs:5001
    env_file:
      - .env
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ipfs:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:4000/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - votechain-network

  # ─── Admin Portal ────────────────────────────
  admin-portal:
    build:
      context: .
      dockerfile: infrastructure/docker/admin-portal.Dockerfile
    container_name: votechain-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:4000
      NEXT_PUBLIC_WS_URL: ws://backend:4000
    ports:
      - '3000:3000'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - votechain-network

  # ─── Results Portal ──────────────────────────
  results-portal:
    build:
      context: .
      dockerfile: infrastructure/docker/results-portal.Dockerfile
    container_name: votechain-results
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:4000
      NEXT_PUBLIC_WS_URL: ws://backend:4000
    ports:
      - '3001:3000'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - votechain-network

  # ─── Nginx Reverse Proxy ─────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: votechain-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - admin-portal
      - results-portal
    healthcheck:
      test: ['CMD', 'nginx', '-t']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - votechain-network

  # ─── Prometheus Monitoring ───────────────────
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: votechain-prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:9090/-/healthy']
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - votechain-network

  # ─── Grafana Dashboard ──────────────────────
  grafana:
    image: grafana/grafana:10.2.0
    container_name: votechain-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    ports:
      - '3002:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/votechain.json:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/api/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - votechain-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ipfs_data:
    driver: local
  ipfs_staging:
    driver: local
  nginx_certs:
    driver: local
  nginx_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  votechain-network:
    driver: bridge
    name: votechain-network
