name: CD Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Images
        run: |
          docker build -t votechain/backend:latest -f infra/docker/Dockerfile.backend .
          docker build -t votechain/admin-portal:latest -f infra/docker/Dockerfile.admin .

      - name: Deploy to Production
        run: echo "Deploying to EKS Cluster..."
