apiVersion: apps/v1
kind: Deployment
metadata:
  name: votechain-backend
  labels:
    app: votechain-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: votechain-backend
  template:
    metadata:
      labels:
        app: votechain-backend
    spec:
      containers:
      - name: backend
        image: votechain/backend:latest
        ports:
        - containerPort: 4000
        envFrom:
        - secretRef:
            name: votechain-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: votechain-backend-service
spec:
  type: ClusterIP
  ports:
  - port: 4000
    targetPort: 4000
  selector:
    app: votechain-backend
