apiVersion: apps/v1
kind: Deployment
metadata:
  name: votechain-admin
  labels:
    app: votechain-admin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: votechain-admin
  template:
    metadata:
      labels:
        app: votechain-admin
    spec:
      containers:
      - name: admin-portal
        image: votechain/admin-portal:latest
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: votechain-admin-service
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
  selector:
    app: votechain-admin
